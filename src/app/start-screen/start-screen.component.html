<div class="start-screen">
  <div class="screen-overlay"></div>

  <section class="menu-column">
    <div class="brand-kicker">Street Tournament</div>
    <h1 class="brand-title">Basketball Shots</h1>
    <p class="brand-copy">
      Quick-fire shooting duel with custom teams and local rivalry.
    </p>

    <div class="menu-panel">
      <button (click)="startGame()" class="menu-button menu-button-primary">Start Match</button>
      <button (click)="playWithComputer()" class="menu-button">Play vs Computer</button>

      <label class="difficulty-panel" for="difficulty">
        <span class="difficulty-label">Computer Difficulty</span>
        <select id="difficulty" [(ngModel)]="difficulty" class="difficulty-select">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>

      <button (click)="changeTeams()" class="menu-button menu-button-compact">Edit Teams</button>
      <button (click)="howToPlay()" class="menu-button menu-button-compact">How To Play</button>
      <button (click)="quitApp()" class="menu-button menu-button-danger menu-button-compact">Quit Game</button>
    </div>

    <div class="volume-dock">
      <app-volume-control></app-volume-control>
    </div>
  </section>

  <section class="art-panel">
    <div class="art-frame"></div>
  </section>
</div>
