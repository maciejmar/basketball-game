<div class="start-screen">
  <div class="screen-overlay"></div>

  <section class="hero-panel">
    <div class="brand-kicker">Street Tournament</div>
    <h1 class="brand-title">Basketball Shots</h1>
    <p class="brand-copy">
      Quick-fire shooting duel with custom teams, local rivalry and clean arcade pacing.
    </p>

    <div class="menu-panel">
      <button (click)="startGame()" class="menu-button menu-button-primary">Start Match</button>
      <button (click)="playWithComputer()" class="menu-button">Play vs Computer</button>

      <label class="difficulty-panel" for="difficulty">
        <span class="difficulty-label">Computer Difficulty</span>
        <select id="difficulty" [(ngModel)]="difficulty" class="difficulty-select">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>

      <div class="menu-grid">
        <button (click)="changeTeams()" class="menu-button menu-button-small">Edit Teams</button>
        <button (click)="howToPlay()" class="menu-button menu-button-small">How To Play</button>
      </div>

      <button (click)="quitApp()" class="menu-button menu-button-danger">Quit Game</button>
    </div>
  </section>

  <div class="volume-dock">
    <app-volume-control></app-volume-control>
  </div>
</div>
