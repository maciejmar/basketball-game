<div class="change-teams-page">
  <div class="teams-shell">
    <div class="teams-scroller" #teamsScroller (scroll)="onTeamsScroll()">
      <section class="teams-screen">
        <div class="teams-header">
          <div class="teams-kicker">Roster Setup</div>
          <h1>Edit Team Names</h1>
          <p>Update team one, then move to the next screen for team two.</p>
        </div>

        <div class="team-editor-card">
          <div class="team-card-header">
            <h2>{{ team1.name }}</h2>
            <div class="team-badge">Team One</div>
          </div>

          <div class="field-group">
            <label class="field-label">Team Name</label>
            <input [(ngModel)]="team1.name" class="field-input" />
          </div>

          <div *ngFor="let player of team1.players; let i = index" class="field-group">
            <label class="field-label">Player {{ i + 1 }}</label>
            <input [(ngModel)]="player.name" class="field-input" />
          </div>
        </div>
      </section>

      <section class="teams-screen">
        <div class="team-editor-card">
          <div class="team-card-header">
            <h2>{{ team2.name }}</h2>
            <div class="team-badge">Team Two</div>
          </div>

          <div class="field-group">
            <label class="field-label">Team Name</label>
            <input [(ngModel)]="team2.name" class="field-input" />
          </div>

          <div *ngFor="let player of team2.players; let i = index" class="field-group">
            <label class="field-label">Player {{ i + 1 }}</label>
            <input [(ngModel)]="player.name" class="field-input" />
          </div>
        </div>

        <div class="teams-actions">
          <button (click)="saveTeams()" class="save-button">Save Teams</button>
        </div>
      </section>
    </div>

    <button
      class="screen-arrow"
      type="button"
      [attr.aria-label]="arrowLabel"
      (click)="scrollTeams(arrowDirection)"
    >
      <span class="screen-arrow-icon" [class.screen-arrow-icon-up]="arrowDirection === 'up'">
        {{ arrowDirection === 'up' ? '↑' : '↓' }}
      </span>
      <span class="screen-arrow-text">{{ arrowLabel }}</span>
    </button>
  </div>
</div>
