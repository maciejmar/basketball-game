<div class="volume-control">
  <button
    type="button"
    class="volume-toggle"
    (click)="toggleMute()"
    [attr.aria-label]="isMuted ? 'Unmute sound' : 'Mute sound'"
  >
    <i *ngIf="isMuted" class="bi bi-volume-mute-fill"></i>
    <i *ngIf="!isMuted" class="bi bi-volume-up-fill"></i>
  </button>
</div>
